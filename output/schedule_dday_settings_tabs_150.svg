<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="972" viewBox="0 0 920 648">
  <rect width="920" height="648" fill="#eef2f7"/>
  <rect x="18" y="18" width="884" height="612" rx="12" fill="#ffffff" stroke="#ccd5e4"/>
  <text x="42" y="54" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="700" fill="#24314b">설정</text>
  <text x="98" y="54" font-family="Malgun Gothic, sans-serif" font-size="12" fill="#65708a">Windows 150% 배율 시안</text>

  <g transform="translate(36 76)" font-family="Malgun Gothic, sans-serif" font-size="14" text-anchor="middle">
    <rect width="848" height="46" rx="9" fill="#f5f7fb" stroke="#d8dfeb"/>
    <text x="106" y="29" fill="#59657d">단축키</text>
    <rect x="212" y="4" width="212" height="38" rx="7" fill="#e9eeff"/>
    <text x="318" y="29" fill="#3155d8" font-weight="700">일정·D-Day</text>
    <rect x="248" y="39" width="140" height="3" rx="1.5" fill="#4d67e8"/>
    <text x="530" y="29" fill="#59657d">프로그램</text>
    <text x="742" y="29" fill="#59657d">데이터</text>
  </g>

  <g transform="translate(36 142)" font-family="Malgun Gothic, sans-serif">
    <rect width="538" height="414" rx="10" fill="#ffffff" stroke="#d8dfeb"/>
    <text x="20" y="34" font-size="16" font-weight="700" fill="#24314b">일정 포스트잇</text>
    <text x="20" y="55" font-size="12" fill="#65708a">표시 대상과 완료 방식을 정합니다.</text>

    <text x="20" y="94" font-size="13" font-weight="700" fill="#35415a">표시 대상</text>
    <g transform="translate(150 75)" font-size="13" fill="#24314b">
      <rect width="18" height="18" rx="3" fill="#4d67e8"/><path d="M4 9l4 4 7-9" fill="none" stroke="white" stroke-width="2"/>
      <text x="26" y="14">일정</text>
      <rect x="92" width="18" height="18" rx="3" fill="#4d67e8"/><path d="M96 9l4 4 7-9" fill="none" stroke="white" stroke-width="2"/>
      <text x="118" y="14">할 일</text>
      <rect x="190" width="18" height="18" rx="3" fill="white" stroke="#8490a6"/>
      <text x="216" y="14">메모 D-Day</text>
    </g>

    <text x="20" y="137" font-size="13" font-weight="700" fill="#35415a">기본 보기</text>
    <rect x="150" y="115" width="360" height="32" rx="7" fill="white" stroke="#4d67e8" stroke-width="2"/>
    <text x="162" y="136" font-size="13" fill="#24314b">당일</text><text x="490" y="136" font-size="12" fill="#65708a">⌄</text>

    <text x="20" y="181" font-size="13" font-weight="700" fill="#35415a">최대 줄 수</text>
    <rect x="150" y="159" width="100" height="32" rx="7" fill="white" stroke="#cfd8e6"/>
    <text x="162" y="180" font-size="13" fill="#24314b">8</text><text x="263" y="180" font-size="12" fill="#65708a">9건부터 스크롤</text>

    <text x="20" y="225" font-size="13" font-weight="700" fill="#35415a">완료 방식</text>
    <rect x="150" y="203" width="360" height="32" rx="7" fill="white" stroke="#cfd8e6"/>
    <text x="162" y="224" font-size="13" fill="#24314b">삭선으로 남기기</text><text x="490" y="224" font-size="12" fill="#65708a">⌄</text>

    <text x="20" y="269" font-size="13" font-weight="700" fill="#35415a">반복 완료</text>
    <rect x="150" y="247" width="360" height="32" rx="7" fill="white" stroke="#cfd8e6"/>
    <text x="162" y="268" font-size="13" fill="#24314b">이번 회차만</text><text x="490" y="268" font-size="12" fill="#65708a">⌄</text>

    <text x="20" y="313" font-size="13" font-weight="700" fill="#35415a">단축키</text>
    <rect x="150" y="291" width="360" height="32" rx="7" fill="white" stroke="#cfd8e6"/>
    <text x="162" y="312" font-size="13" fill="#8a93a6">지정하지 않음</text>
    <text x="150" y="343" font-size="11" fill="#65708a">빈 값이면 등록하지 않습니다. 지정할 때 기존 충돌 검사를 사용합니다.</text>

    <rect x="20" y="365" width="490" height="31" rx="7" fill="#f5f7fb"/>
    <text x="32" y="385" font-size="12" fill="#53617b">창 위치·보기·줄 수·표시 대상·완료 방식을 재실행 후 복원</text>
  </g>

  <g transform="translate(590 142)" font-family="Malgun Gothic, sans-serif">
    <rect width="294" height="245" rx="10" fill="#ffffff" stroke="#d8dfeb"/>
    <text x="18" y="34" font-size="16" font-weight="700" fill="#24314b">지난 D-Day</text>
    <text x="18" y="55" font-size="12" fill="#65708a">밀린 마감의 위치와 표시를 정합니다.</text>
    <text x="18" y="94" font-size="13" font-weight="700" fill="#35415a">표시 위치</text>
    <rect x="18" y="106" width="258" height="32" rx="7" fill="white" stroke="#cfd8e6"/>
    <text x="30" y="127" font-size="13" fill="#24314b">오늘 요약 상단 · 접이식</text><text x="256" y="127" font-size="12" fill="#65708a">⌄</text>
    <rect x="18" y="155" width="18" height="18" rx="3" fill="#4d67e8"/><path d="M22 164l4 4 7-9" fill="none" stroke="white" stroke-width="2"/>
    <text x="46" y="169" font-size="13" fill="#24314b">목표 날짜·시각 함께 표시</text>
    <rect x="18" y="187" width="18" height="18" rx="3" fill="#4d67e8"/><path d="M22 196l4 4 7-9" fill="none" stroke="white" stroke-width="2"/>
    <text x="46" y="201" font-size="13" fill="#24314b">날짜 경과 후에도 유지</text>
    <text x="18" y="227" font-size="11" fill="#a03a45">자동 완료·자동 삭제하지 않음</text>
  </g>

  <g transform="translate(590 403)" font-family="Malgun Gothic, sans-serif">
    <rect width="294" height="153" rx="10" fill="#fff8dc" stroke="#dfbd45"/>
    <text x="18" y="31" font-size="14" font-weight="700" fill="#594d1c">배율 대응 확인</text>
    <text x="18" y="59" font-size="12" fill="#5f5324">• 콘텐츠를 범주별 한 페이지로 분리</text>
    <text x="18" y="82" font-size="12" fill="#5f5324">• 저장·취소 버튼까지 한 화면에 표시</text>
    <text x="18" y="105" font-size="12" fill="#5f5324">• 설정 페이지 내부 스크롤 없음</text>
    <text x="18" y="128" font-size="12" fill="#5f5324">• Tab 순서는 탭 → 필드 → 저장</text>
  </g>

  <line x1="36" y1="578" x2="884" y2="578" stroke="#d8dfeb"/>
  <g transform="translate(692 592)" font-family="Malgun Gothic, sans-serif" font-size="13" text-anchor="middle">
    <rect width="86" height="32" rx="7" fill="white" stroke="#cbd4e3"/><text x="43" y="21" fill="#35415a">취소</text>
    <rect x="96" width="96" height="32" rx="7" fill="#4d67e8"/><text x="144" y="21" fill="white" font-weight="700">저장</text>
  </g>
</svg>
