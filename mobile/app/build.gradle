plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.toma.companion'
    compileSdk 36
    defaultConfig { applicationId 'com.toma.companion'; minSdk 29; targetSdk 35; versionCode 3; versionName '0.3.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    signingConfigs {
        release {
            def keyPath = System.getenv('TOMA_SIGNING_KEY')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword file(System.getenv('TOMA_SIGNING_PASSWORD_FILE')).text.trim()
                keyAlias 'toma-mobile'
                keyPassword storePassword
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}
dependencies {
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-tasklist:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
